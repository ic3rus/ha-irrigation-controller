rules:
  # Bronze
  action-setup:
    status: done
    comment: cancel_cycle, run_now, set_season and set_zone_duration are registered in async_setup (services.py), so they stay registered while the entry is unloaded. Each handler resolves the entry per call via homeassistant.helpers.service.async_get_config_entry, which raises the translated "not found"/"not loaded"/"multiple entries" errors itself.
  appropriate-polling:
    status: exempt
    comment: iot_class is calculated — the integration does not poll.
  brands:
    status: todo
  common-modules:
    status: todo
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: 100% of config_flow.py — user step (create, optional sensors omitted, start-time conflict and recovery, both aborts), options flow (prefill, reload-on-edit, clearing an optional sensor, conflict and recovery) and the zone subentry flow (add with defaults pinned, valve-is-pump and duplicate-valve errors with recovery, reconfigure incl. the exclude-self branch, removal, reload-on-change).
  dependency-transparency:
    status: done
  docs-actions:
    status: done
    comment: README "Services" section documents all four actions, their fields and units, that run_now runs with the season off and is refused while a cycle is active, that season OFF does not stop a running cycle, and the mid-cycle reload caveat.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: todo
  entity-event-setup:
    status: done
    comment: The sensor projections subscribe to the engine-state dispatcher signal in async_added_to_hass and release it through async_on_remove; no subscription exists outside that pair.
  entity-unique-id:
    status: done
    comment: Unique ids are derived in the shared bases from the entry id (controller entities) or the entry id plus the zone subentry id (zone entities) and a stable key — never from an operator-editable name.
  has-entity-name:
    status: done
    comment: Both bases pin _attr_has_entity_name; names come from translation_key, so no entity hardcodes a user-visible string.
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: No device/service connection to test — local calculated helper.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: Every failure path of the four actions raises a translated ServiceValidationError (no_cycle_running, cycle_already_running, no_zones, unknown_zone, invalid_duration, cycles_overlap); the "no entry"/"not loaded"/"multiple entries" cases come already translated from async_get_config_entry. Range and identity checks live in the handlers rather than the voluptuous schemas, so a bad value never surfaces as an untranslated vol.Invalid.
