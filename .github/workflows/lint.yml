name: Lint

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly: mypy sees HA API changes before they break
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements_lint.txt

      - name: Install requirements
        run: python3 -m pip install -r requirements_lint.txt

      - name: Lint
        run: python3 -m ruff check .

      - name: Format
        run: python3 -m ruff format . --check

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements_test.txt

      # Type checking needs the Home Assistant type information, hence the test
      # requirements rather than the lint ones.
      - name: Install requirements
        run: python3 -m pip install -r requirements_test.txt

      - name: Type check
        run: python3 -m mypy custom_components/ tests/
