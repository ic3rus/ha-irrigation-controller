name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN permissions are narrowed to the minimum, but not to
# nothing: actions/checkout and the HACS API calls both need contents:read.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs: # https://github.com/hacs/action
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      # The action fetches hacs.json/manifest.json over the network rather than
      # from the workspace, so no checkout step is needed here.
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Remove 'ignore: brands' once brand images are submitted
          ignore: brands
