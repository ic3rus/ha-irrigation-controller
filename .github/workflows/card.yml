name: Card

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Rollup build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: card/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build card bundle
        run: npm run build

      - name: Committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/ha_irrigation_controller/frontend/

      - name: Run vitest
        run: npm test
