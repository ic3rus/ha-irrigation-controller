name: Card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly: catches upstream Lit/Rollup/browser breakage
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: card-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Rollup build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: card/package-lock.json

      - name: Install dependencies
        run: npm ci

      # vitest strips types via esbuild without checking them, so this is the only
      # thing that type-checks the card — test files included.
      - name: Type check
        run: npm run typecheck

      - name: Install the browser vitest renders in
        run: npx playwright install --with-deps chromium

      - name: Run vitest
        run: npm test

      - name: Build card bundle
        run: npm run build

      # `git diff` inspects TRACKED paths only, so an extra chunk, a sourcemap or a
      # renamed entry point would leave this gate green while the HACS payload went
      # stale. --untracked-files=all is what closes that hole.
      - name: Committed bundle is up to date
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          target=custom_components/ha_irrigation_controller/frontend
          if [[ -n "$(git status --porcelain --untracked-files=all -- "$target")" ]]; then
            echo "::error::The committed card bundle does not match a fresh build."
            git status --porcelain --untracked-files=all -- "$target"
            git diff -- "$target"
            exit 1
          fi
