version: 2

# Every version in this repo is exactly pinned, in an ecosystem that breaks on a
# monthly cadence — so the pins need an owner. Dependabot opens the PR, CI decides
# whether the bump is safe. Note it cannot touch hassfest@master / hacs/action@main:
# a mutable ref is not a version.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # homeassistant and PHCC are one decision: PHCC hard-pins a HA version, so
      # bumping either alone produces an unresolvable requirement set.
      home-assistant:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
      python-tooling:
        patterns:
          - ruff
          - mypy
          - colorlog

  - package-ecosystem: npm
    directory: /card
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      card-runtime:
        patterns:
          - lit
          - custom-card-helpers
          - home-assistant-js-websocket
      card-tooling:
        patterns:
          - "@rollup/*"
          - rollup
          - typescript
          - tslib
          - vitest
          - "@vitest/*"
          - playwright
    ignore:
      # TypeScript 7 is the native (Go) compiler and no longer exposes the JS
      # compiler API (`ts.ScriptTarget` and friends) that
      # @rollup/plugin-typescript needs. The card build fails at config load
      # time on TS 7 (PR #14). Drop this once the plugin supports TS 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
